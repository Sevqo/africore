<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Customer records connect to shared business work</title>
  <desc id="desc">A three-step illustration: add a permitted contact, keep one shared customer record, and use that record in supported orders, invoices and follow-up.</desc>
  <rect width="960" height="520" rx="24" fill="#f7f7f7"/>
  <text x="64" y="74" fill="#426900" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">CUSTOMER RELATIONSHIPS</text>
  <text x="64" y="116" fill="#111" font-family="Arial,sans-serif" font-size="31" font-weight="700">One contact, connected records</text>
  <g font-family="Arial,sans-serif">
    <rect x="64" y="168" width="232" height="246" rx="18" fill="#fff" stroke="#d1d1d1" stroke-width="2"/>
    <circle cx="112" cy="218" r="24" fill="#eaf3db"/><path d="M103 218h18M112 209v18" stroke="#426900" stroke-width="3" stroke-linecap="round"/>
    <text x="96" y="278" fill="#426900" font-size="15" font-weight="700">01 · ADD</text>
    <text x="96" y="315" fill="#111" font-size="21" font-weight="700">Permitted contact</text>
    <text x="96" y="352" fill="#555" font-size="16">Save only the details</text><text x="96" y="376" fill="#555" font-size="16">needed for the work.</text>
    <path d="M314 290h40m-12-12 12 12-12 12" fill="none" stroke="#426900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="364" y="168" width="232" height="246" rx="18" fill="#fff" stroke="#d1d1d1" stroke-width="2"/>
    <circle cx="412" cy="218" r="24" fill="#eaf3db"/><path d="M402 212h20M402 220h20M402 228h13" stroke="#426900" stroke-width="2.5" stroke-linecap="round"/>
    <text x="396" y="278" fill="#426900" font-size="15" font-weight="700">02 · KEEP</text>
    <text x="396" y="315" fill="#111" font-size="21" font-weight="700">Shared record</text>
    <text x="396" y="352" fill="#555" font-size="16">One customer record</text><text x="396" y="376" fill="#555" font-size="16">serves authorized apps.</text>
    <path d="M614 290h40m-12-12 12 12-12 12" fill="none" stroke="#426900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="664" y="168" width="232" height="246" rx="18" fill="#fff" stroke="#d1d1d1" stroke-width="2"/>
    <circle cx="712" cy="218" r="24" fill="#eaf3db"/><path d="M701 210h22v17h-22zM706 206h12M707 216h10M707 221h7" fill="none" stroke="#426900" stroke-width="2.3" stroke-linejoin="round"/>
    <text x="696" y="278" fill="#426900" font-size="15" font-weight="700">03 · USE</text>
    <text x="696" y="315" fill="#111" font-size="21" font-weight="700">Business work</text>
    <text x="696" y="352" fill="#555" font-size="16">Use it in orders,</text><text x="696" y="376" fill="#555" font-size="16">invoices or follow-up.</text>
  </g>
  <text x="64" y="466" fill="#666" font-family="Arial,sans-serif" font-size="15">A saved contact is not identity verification or proof of payment.</text>
</svg>
